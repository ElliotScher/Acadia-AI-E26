[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acadia-ai-e26"
version = "0.1.0"
description = "Acadia AI E26 project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.0",
    "ultralytics>=8.0.0",
    "opencv-python>=4.0.0",
    "tqdm>=4.66.0",
    "torch>=2.12.1",
    "torchvision",
    "pyside6>=6.11.1",
    "black>=26.5.1",
    "fast-plate-ocr[onnx]>=1.1.0",
    "matplotlib>=3.10.0",
    "sqlalchemy>=2.0.51",
    "pytest>=9.1.1",
    "pytesseract>=0.3.13",
    "gdown>=6.1.0",
    "pyinstaller>=6.21.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
# fast-plate-ocr transitively installs opencv headless which overwrites full opencv, this stops that
override-dependencies = ["opencv-python-headless; sys_platform == 'never'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
